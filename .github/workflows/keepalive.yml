name: Keep backend awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl --silent --show-error --fail --max-time 180 --retry 2 https://deepcut-api-mvyu.onrender.com/api/health
